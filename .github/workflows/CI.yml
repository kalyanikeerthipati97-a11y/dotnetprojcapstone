name: Build dotnet app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: |
          cd netflixprojectcapstone
          dotnet restore
      - name: Build
        run: |
          cd netflixprojectcapstone
          dotnet build --configuration Release